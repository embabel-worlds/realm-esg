# Framework REQUIREMENTS — the individual disclosure asks each framework makes. A requirement is
# the thing a consumer wants answered IN ITS OWN LANGUAGE; an EsgDatapoint is the thing we
# actually observe. The mapping between them lives on the datapoint (reference/datapoints.yml).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# EVERY `code` HERE IS PROVISIONAL — `verified: false` on all of them.
# The whole premise of this realm is that a citation can be CHECKED. Shipping framework codes we
# have not read off the published standard would be the same defect we are attacking. Before any
# of this is shown to anyone, each code must be verified against its source standard and flipped
# to `verified: true` with the clause it was read from.
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# Coverage is a deliberate SLICE — climate, energy, water, safety, diversity, governance — chosen
# because it is where these frameworks genuinely overlap, which is what makes a shared
# observation layer worth proving. ESRS alone runs to ~1,100 datapoints; we cover a dozen.

