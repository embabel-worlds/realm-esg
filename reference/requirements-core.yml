# ── SASB ─────────────────────────────────────────────────────────────────────────────────────
# SASB metric codes are INDUSTRY-SPECIFIC (e.g. `EM-MM-110a.1`). These are topic-level stand-ins:
# a concrete code can only be resolved once the subject's industry is known, which is why
# industry here is a REGISTRY-sourced observation and never scraped from a website.
- type: EsgRequirement
  data: { id: sasb-ghg-emissions, code: "GHG Emissions (topic)", verified: false, industrySpecific: true, title: "Gross global Scope 1 emissions", unit: tCO2e }
  relations: [{ predicate: IN_FRAMEWORK, to: { type: EsgFramework, id: sasb } }]
- type: EsgRequirement
  data: { id: sasb-energy-management, code: "Energy Management (topic)", verified: false, industrySpecific: true, title: "Total energy consumed, percentage grid electricity, percentage renewable", unit: MWh }
  relations: [{ predicate: IN_FRAMEWORK, to: { type: EsgFramework, id: sasb } }]
