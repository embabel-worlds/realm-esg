# The read surface. Prefer these over hand-written Cypher: they encode the joins that are easy to
# get wrong and — for anything that aggregates — they carry the cohort size, because a comparison
# over an ESG corpus is only ever a comparison of what has been assessed, never of a market.
#
# TWO JOINS THAT ARE NOT WHAT THEY LOOK LIKE, both verified against a live graph:
#
#   1. A document does NOT carry the publisher domain as a property, AND you cannot reach it by
#      traversal either. Ingestion merges (d:Document)-[:PUBLISHED_BY]->(o:Organization), but those
#      Organization nodes are not reachable from the user, so the scope rewriter removes the hop and
#      the query returns nothing — with no error, and (because the engine then explains the absence)
#      dressed up as "the request was too broad". Measured on a live appliance: 16 documents visible
#      on their own, 0 through the hop. So every view here derives the domain from the document
#      itself — the `domain:` tag written at ingestion, falling back to the URI host.
#   2. An observation joins its datapoint BY PROPERTY (o.datapointId), not by an edge.
#
# EVERY bound variable MUST carry a label. The scope rewriter has to prove a query can be confined
# to the caller, and it cannot do that for an unlabelled binding, so it REJECTS the query outright
# rather than returning data it cannot scope. `(c)-[:PART_OF]->(d)` is refused; `(c:ContentElement)`
# is fine. Document material is ContentElement — its subtypes are LeafSection and ContainerSection
# for structure, and Chunk for the embedded units the extractor actually collects.

# ── What do we actually hold? Ask this FIRST, before any comparison. ─────────────────────────
- name: EsgCoverage
  description: >-
    Which organizations have material in the corpus, how much was read for each, and when. The
    honest denominator for every other view here: a company absent from this list has not been
    assessed, which is NOT the same as having disclosed nothing.
    Lists a domain as soon as its DOCUMENTS land, before any extraction has run.
    Deliberately does NOT touch HAS_OBSERVATIONS: that edge is a VIRTUAL join, so merely reading it
    starts extraction — a model call per document. A "what do we hold" view must be cheap enough to
    poll, so observation counts live in EsgProfile and EsgExtract instead.
    `lastIngestedEpochMs` is the freshness anchor a re-populate checks before refetching.
  cypher: |
    MATCH (d:Document) WHERE 'esg' IN d.tags
    WITH d, [t IN d.tags WHERE t STARTS WITH 'domain:'][0] AS dt
    WITH d, coalesce(
           CASE WHEN dt IS NULL THEN null ELSE substring(dt, 7) END,
           replace(split(replace(replace(d.uri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '')
         ) AS domain
    OPTIONAL MATCH (c:ContentElement)-[:HAS_PARENT*]->(d:Document)
    WITH domain, d, count(DISTINCT c) AS chunkCount
    RETURN domain,
           count(DISTINCT d) AS documents,
           sum(chunkCount) AS chunks,
           max(d.ingestionEpochMs) AS lastIngestedEpochMs
    ORDER BY domain

# ── Force the read. This is what makes "populate" mean populate. ─────────────────────────────
- name: EsgExtract
  description: >-
    Read one organization's ingested material and return every observation found. The traversal
    here is deliberately NOT optional: extraction is graph-cached and materializes on first
    traversal of HAS_OBSERVATIONS, and an OPTIONAL MATCH may never trigger it — so a corpus can sit
    fully ingested and permanently unread. Running this is the step that turns documents into
    observations. Slow the first time (one model call per document), instant afterwards until the
    document changes.
  params:
    domain:
      type: string
      description: "The organization's domain, e.g. 'acme.com'."
  cypher: |
    // ANCHOR THE JOIN ON ITS KEY FIELD (`uri`, the producer's anchorKeyProperty): the planner
    // materializes a virtual join only when it finds a predicate on that key in the pattern.
    // `ai: {materialize: true}` is the EXPLICIT opt-in past the cold-materialization cost gate,
    // which refuses a query whose ESTIMATED cold model calls exceed the configured ceiling. Right
    // for a passive read; wrong here — this view exists to READ documents and is what the Populate
    // button calls, so the cost is the thing the user just asked for.
    //
    // Without it the failure is silent and LOAD-DEPENDENT: axa.com's two pages (280 + 86 chunks,
    // ~7 windows) were refused together while either alone succeeded, and the refusal arrived as
    // "the request was too broad" with no warning and no producer log line — one company silently
    // skipped while the run reported success.
    //
    // The other views deliberately do NOT carry this: opening a scorecard must not be able to
    // start an unbounded extraction run.
    MATCH (d:Document)-[:HAS_OBSERVATIONS {ai: {materialize: true}}]->(o:EsgObservation)
    WHERE d.uri CONTAINS $domain
    // ONE ANSWER PER DATAPOINT. A long document is extracted in WINDOWS and every window answers
    // every datapoint — AXA's 280-chunk page makes five, so it holds 5 x 14 = 70 rows, most of them
    // the not_disclosed of a window that simply did not contain the relevant text. Returned raw,
    // that makes a well-extracted company look mostly silent and wrecks any rate computed over
    // rows. Prefer a window that actually found something, and report how many did.
    // Pick by AGREEMENT, not arrival order. A long report has many tables — prior-year columns,
    // component sub-totals, restatements — so windows legitimately disagree, and taking the first
    // is a coin toss that reads as an answer. Espersen's 384-chunk report produced Scope 1 of both
    // 3,332 tCO2e (the total) and 184.2 tCO2e (company cars alone); first-wins reported neither
    // reliably. The value the most windows independently found is the total far more often than
    // not, and `candidateValues` says how much disagreement is hiding behind the number: anything
    // above 1 deserves a human before it is quoted.
    WITH o.datapointId AS dpId, collect(o) AS obs
    WITH dpId, obs, [x IN obs WHERE x.value <> 'not_disclosed'] AS said
    UNWIND (CASE WHEN size(said) > 0 THEN said ELSE obs END) AS cand
    WITH dpId, obs, said, cand.value AS v, collect(cand) AS sameValue
    WITH dpId, obs, said, v, sameValue, size(sameValue) AS agreeing
    ORDER BY agreeing DESC, v
    WITH dpId, obs, said, collect({o: sameValue[0], v: v, agreeing: agreeing}) AS ranked
    WITH dpId, ranked[0].o AS o,
         size(said) AS windowsDisclosing,
         size(obs) AS windowsRead,
         ranked[0].agreeing AS windowsAgreeing,
         size(ranked) AS candidateValues
    RETURN o.docUri AS document, dpId AS datapoint, o.value AS value,
           o.unit AS unit, o.period AS period, o.quote AS quote, o.sourceChunkId AS chunkId,
           windowsDisclosing, windowsRead, windowsAgreeing, candidateValues
    ORDER BY datapoint

# ── One company, everything we read ──────────────────────────────────────────────────────────
- name: EsgProfile
  description: >-
    Every datapoint observed for one organization, with the verbatim quote it was read from and
    the chunk that quote lives in. Includes not_disclosed rows — what a company is SILENT on is a
    finding, not a gap in the data.
  params:
    domain:
      type: string
      description: "The organization's domain as ingested, e.g. 'acme.com'."
  cypher: |
    // ANCHOR THE JOIN ON ITS KEY FIELD (`uri`, the producer's anchorKeyProperty): the planner
    // materializes a virtual join only when it finds a predicate on that key in the pattern.
    MATCH (d:Document)-[:HAS_OBSERVATIONS]->(o:EsgObservation)
    WHERE d.uri CONTAINS $domain
    // ONE ANSWER PER DATAPOINT. A long document is extracted in WINDOWS and every window answers
    // every datapoint — AXA's 280-chunk page makes five, so it holds 5 x 14 = 70 rows, most of them
    // the not_disclosed of a window that simply did not contain the relevant text. Returned raw,
    // that makes a well-extracted company look mostly silent and wrecks any rate computed over
    // rows. Prefer a window that actually found something, and report how many did.
    // Pick by AGREEMENT, not arrival order. A long report has many tables — prior-year columns,
    // component sub-totals, restatements — so windows legitimately disagree, and taking the first
    // is a coin toss that reads as an answer. Espersen's 384-chunk report produced Scope 1 of both
    // 3,332 tCO2e (the total) and 184.2 tCO2e (company cars alone); first-wins reported neither
    // reliably. The value the most windows independently found is the total far more often than
    // not, and `candidateValues` says how much disagreement is hiding behind the number: anything
    // above 1 deserves a human before it is quoted.
    WITH o.datapointId AS dpId, collect(o) AS obs
    WITH dpId, obs, [x IN obs WHERE x.value <> 'not_disclosed'] AS said
    UNWIND (CASE WHEN size(said) > 0 THEN said ELSE obs END) AS cand
    WITH dpId, obs, said, cand.value AS v, collect(cand) AS sameValue
    WITH dpId, obs, said, v, sameValue, size(sameValue) AS agreeing
    ORDER BY agreeing DESC, v
    WITH dpId, obs, said, collect({o: sameValue[0], v: v, agreeing: agreeing}) AS ranked
    WITH dpId, ranked[0].o AS o,
         size(said) AS windowsDisclosing,
         size(obs) AS windowsRead,
         ranked[0].agreeing AS windowsAgreeing,
         size(ranked) AS candidateValues
    OPTIONAL MATCH (dp:EsgDatapoint {id: dpId})
    RETURN coalesce(dp.name, dpId) AS datapoint, dp.answerType AS type, o.value AS value,
           o.unit AS unit, o.period AS period, o.confidence AS confidence, o.quote AS evidence,
           o.docUri AS sourceUrl, o.sourceChunkId AS chunkId,
           windowsDisclosing, windowsRead, windowsAgreeing, candidateValues
    ORDER BY datapoint

# ── The same observations, in one framework's language ───────────────────────────────────────
- name: EsgFrameworkReport
  description: >-
    One organization's observations projected into a single reporting framework — GHG Protocol,
    ESRS (CSRD), GRI, ISSB, SASB or IRIS+. This is the point of the realm: the data was captured
    once and cited once, and each framework is a different rendering of it.
    WARNING: requirement codes are PROVISIONAL (r.verified is false across 0.1.0) and must be
    checked against the published standard before being quoted to anyone.
  params:
    domain:
      type: string
      description: "The organization's domain, e.g. 'acme.com'."
    framework:
      type: string
      default: gri
      description: "Framework id: ghg-protocol | esrs | gri | issb | sasb | iris-plus | vendor-baseline."
  cypher: |
    MATCH (f:EsgFramework {id: $framework})<-[:IN_FRAMEWORK]-(r:EsgRequirement)<-[:SATISFIES]-(dp:EsgDatapoint)
    OPTIONAL MATCH (d:Document)-[:HAS_OBSERVATIONS]->(o:EsgObservation)
      WHERE d.uri CONTAINS $domain AND o.datapointId = dp.id
    RETURN r.code AS code, r.title AS requirement, r.verified AS codeVerified,
           dp.name AS datapoint,
           coalesce(o.value, 'not_assessed') AS value, o.unit AS unit, o.period AS period,
           o.quote AS evidence
    ORDER BY r.code

# ── What is this company NOT saying? The question a confirmation-only dataset cannot answer ──
- name: EsgSilence
  description: >-
    Datapoints where the organization's published material says nothing. Distinguishes
    'not_disclosed' (we read the material and it is silent) from 'not_assessed' (we never looked),
    because conflating those is the defect that makes a scraped ESG dataset worthless.
  params:
    domain:
      type: string
      description: "The organization's domain, e.g. 'acme.com'."
  cypher: |
    MATCH (dp:EsgDatapoint)
    OPTIONAL MATCH (d:Document)-[:HAS_OBSERVATIONS]->(o:EsgObservation)
      WHERE d.uri CONTAINS $domain AND o.datapointId = dp.id
    WITH dp, o
    WHERE o IS NULL OR o.value = 'not_disclosed'
    RETURN dp.name AS datapoint, dp.answerType AS type,
           CASE WHEN o IS NULL THEN 'not_assessed' ELSE 'not_disclosed' END AS status
    ORDER BY status, dp.name

# ── Comparison — ALWAYS with its n ────────────────────────────────────────────────────────────
- name: EsgDisclosureRate
  description: >-
    How much of one organization's assessed material is actual disclosure rather than silence.
    Run it per company and set the results side by side to compare — and state how many companies
    were asked, because the cohort is whatever has been assessed, never a market.
  params:
    domain:
      type: string
      description: "The organization's domain, e.g. 'acme.com'."
  cypher: |
    // Anchored on ONE company, deliberately. A cross-company aggregate is not expressible here:
    // EsgObservation is a VIRTUAL label, and the engine refuses to bind one except through a
    // registered relationship from a bound anchor — "virtual label 'EsgObservation' is not reached
    // via a registered relationship from a bound anchor". So there is no query that sweeps every
    // company's observations at once, and pretending otherwise would return a confident number
    // over whichever anchors happened to resolve.
    //
    // To compare companies, call this once per domain and put the results side by side — with the
    // count of companies asked, because the cohort is whatever has been assessed, never a market.
    MATCH (d:Document)-[:HAS_OBSERVATIONS]->(o:EsgObservation)
    WHERE d.uri CONTAINS $domain
    RETURN $domain AS company,
           count(o) AS observations,
           count(CASE WHEN o.value <> 'not_disclosed' THEN 1 END) AS disclosing,
           round(100.0 * count(CASE WHEN o.value <> 'not_disclosed' THEN 1 END) / count(o)) AS pctDisclosing

# ── What can this realm see at all, and what does each thing feed? ───────────────────────────
- name: EsgDatapointCatalogue
  description: >-
    Every datapoint this realm can observe, what form its answer takes, and which framework
    requirements it satisfies. Read this to know what CAN be asked before asking it.
  cypher: |
    MATCH (dp:EsgDatapoint)
    OPTIONAL MATCH (dp:EsgDatapoint)-[:SATISFIES]->(r:EsgRequirement)-[:IN_FRAMEWORK]->(f:EsgFramework)
    RETURN dp.id AS datapoint, dp.name AS name, dp.answerType AS answerType, dp.unit AS unit,
           dp.sourceClass AS sourceClass,
           collect(DISTINCT f.name) AS frameworks,
           collect(DISTINCT r.code) AS requirementCodes
    ORDER BY dp.answerType, dp.id

# ── The bounded unit of work. Extract ONE document. ─────────────────────────────────────────
- name: EsgExtractDocument
  description: >-
    Read ONE document and return its observations. This is the bounded unit of extraction and the
    one to drive a batch with: cost is proportional to a single document, progress is visible per
    document, and a slow page cannot stall the others.
    Prefer this over EsgExtract for anything that loops. EsgExtract takes a DOMAIN, so a company
    with several pages materializes all of them inside one request — measured on axa.com's two
    pages (366 chunks): the same work completed per-document in minutes, and per-domain it ran
    over six minutes without starting a single window or emitting a log line, while the app stayed
    fully responsive to everything else. Bounding the request avoids the failure rather than
    waiting on it.
  params:
    uri:
      type: string
      description: "Exact document uri, as listed by EsgDocuments."
  cypher: |
    MATCH (d:Document {uri: $uri})-[:HAS_OBSERVATIONS {ai: {materialize: true}}]->(o:EsgObservation)
    WITH o.datapointId AS dpId, collect(o) AS obs
    WITH dpId, obs, [x IN obs WHERE x.value <> 'not_disclosed'] AS said
    WITH dpId,
         CASE WHEN size(said) > 0 THEN said[0] ELSE obs[0] END AS o,
         size(said) AS windowsDisclosing,
         size(obs) AS windowsRead
    RETURN o.docUri AS document, dpId AS datapoint, o.value AS value,
           o.unit AS unit, o.period AS period, o.quote AS quote, o.sourceChunkId AS chunkId,
           windowsDisclosing, windowsRead
    ORDER BY datapoint

# ── The work list ────────────────────────────────────────────────────────────────────────────
- name: EsgDocuments
  description: >-
    The ingested documents for one organization, largest first, with their chunk counts. The work
    list for a batch: iterate these through EsgExtractDocument rather than asking for a whole
    domain at once. Reads nothing virtual, so it never triggers extraction.
  params:
    domain:
      type: string
      description: "The organization's domain, e.g. 'acme.com'."
  cypher: |
    MATCH (d:Document) WHERE 'esg' IN d.tags AND d.uri CONTAINS $domain
    OPTIONAL MATCH (c:Chunk)-[:HAS_PARENT*]->(d:Document)
    RETURN d.uri AS uri, d.title AS title, count(c) AS chunks
    ORDER BY chunks DESC

# ── RANKING AND SCORING ──────────────────────────────────────────────────────────────────────
# These read PERSISTED observations and never trigger extraction, so they are cheap enough to
# poll. They became possible only once the producer declared `cache: { kind: graph }`: while
# observations were transient, EsgObservation was a virtual label and the engine refused to bind
# one except from a bound anchor — no query could sweep every company at once. Persisted, they are
# ordinary nodes.
#
# EVERY ONE OF THESE RETURNS ITS COHORT. A rate over an ESG corpus is a rate over whatever has been
# assessed — companies enter it because somebody asked about them, not because they were sampled —
# so `companies` and `assessed` are columns, never footnotes. A score without its n is not a score.

- name: EsgLeaderboard
  description: >-
    Companies ranked by how much of the catalogue they actually disclose. This ranks DISCLOSURE,
    not performance: a company that publishes a large emissions figure ranks ABOVE one that
    publishes nothing, which is the honest ordering when the source is the company's own material.
    `assessed` is the denominator — a low rate on 4 datapoints means something different from a low
    rate on 14.
  cypher: |
    MATCH (o:EsgObservation)
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.datapointId AS dp,
         max(CASE WHEN o.value <> 'not_disclosed' THEN 1 ELSE 0 END) AS disclosed
    WITH company, count(dp) AS assessed, sum(disclosed) AS disclosing
    RETURN company, assessed, disclosing,
           round(100.0 * disclosing / assessed) AS pctDisclosed
    ORDER BY pctDisclosed DESC, company

- name: EsgDatapointRarity
  description: >-
    How many of the assessed companies disclose each datapoint, rarest first. Answers "what does
    almost nobody publish" — the questions where a disclosure is a genuine differentiator, and
    where an absence says little because absence is the norm.
  cypher: |
    MATCH (o:EsgObservation)
    WITH o.datapointId AS dpId,
         replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         max(CASE WHEN o.value <> 'not_disclosed' THEN 1 ELSE 0 END) AS disclosed
    WITH dpId, count(company) AS companies, sum(disclosed) AS disclosing
    OPTIONAL MATCH (dp:EsgDatapoint {id: dpId})
    RETURN coalesce(dp.name, dpId) AS datapoint, dp.answerType AS type,
           companies, disclosing,
           round(100.0 * disclosing / companies) AS pctDisclosing
    ORDER BY pctDisclosing ASC, datapoint

- name: EsgMetricRanking
  description: >-
    Every company that publishes a figure for one quantitative datapoint, ranked by that figure,
    with the sentence each was read from. THE UNITS ARE AS PUBLISHED AND ARE NOT CONVERTED — one
    company may report tonnes and another kilotonnes, so read `unit` before comparing, and treat a
    ranking across mixed units as wrong rather than approximate. Companies absent from the result
    did not publish the figure; that is not a zero.
  params:
    datapointId:
      type: string
      default: ghg_scope1
      description: "A quantitative datapoint id, e.g. 'ghg_scope1' or 'renewable_energy_share'."
  cypher: |
    // A RANKING MUST NOT CARRY A CONTESTED FIGURE. A long report states the same quantity several
    // ways — prior-year columns, component sub-totals, restatements — so windows disagree, and a
    // view that silently picks one puts a coin toss into a league table. Espersen's report yielded
    // Scope 1 as both 3,332 tCO2e (the total) and 184.2 tCO2e (company cars); ranking either as
    // "Espersen's Scope 1" would be wrong, and ranking the smaller one flatters them.
    //
    // So this ranks only figures the extraction AGREED on, and returns the contested ones
    // separately as `contested` so they are visible rather than dropped. A number nobody can
    // settle is not a number to rank.
    MATCH (o:EsgObservation {datapointId: $datapointId})
    WHERE o.value <> 'not_disclosed' AND toFloat(o.value) IS NOT NULL
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.value AS v, o.unit AS unit, o.period AS period, o.quote AS evidence
    WITH company, collect(DISTINCT v) AS values, collect({v: v, unit: unit, period: period, evidence: evidence}) AS all
    RETURN company,
           CASE WHEN size(values) = 1 THEN toFloat(values[0]) ELSE null END AS figure,
           all[0].unit AS unit, all[0].period AS period, all[0].evidence AS evidence,
           size(values) AS candidateValues,
           size(values) > 1 AS contested
    ORDER BY contested, figure DESC

- name: EsgConfidence
  description: >-
    A quality signal per company rather than a content one: how many of its answers carry a
    verbatim quote, and how strongly the extraction windows agreed. A datapoint found by 1 window
    of 9 is weaker evidence than one found by 8 of 9 — the low-agreement answers are where the
    wrong-population and wrong-scope errors have actually turned up, so this is the column to sort
    by when deciding what a person should read first.
  cypher: |
    MATCH (o:EsgObservation)
    WHERE o.value <> 'not_disclosed'
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.datapointId AS dp,
         count(*) AS windowsRead,
         sum(CASE WHEN o.quote IS NOT NULL AND o.quote <> 'NONE' THEN 1 ELSE 0 END) AS quoted
    WITH company, count(dp) AS disclosed, sum(windowsRead) AS windowAnswers, sum(quoted) AS quoted
    RETURN company, disclosed, quoted,
           round(100.0 * quoted / windowAnswers) AS pctQuoted
    ORDER BY pctQuoted ASC, company

- name: EsgTypeProfile
  description: >-
    What KIND of disclosure each company makes: figures, narrative commitments, or bare yes/no.
    The distinction the baseline questionnaire cannot express — it answers everything "Yes", so a
    company publishing audited tonnages and one publishing a mission statement score identically.
    A high `quantities` count is a company you can actually compute with.
  cypher: |
    MATCH (o:EsgObservation)
    WHERE o.value <> 'not_disclosed'
    MATCH (dp:EsgDatapoint {id: o.datapointId})
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         dp.id AS dpId, dp.answerType AS kind
    WITH company, kind, count(DISTINCT dpId) AS n
    RETURN company,
           sum(CASE WHEN kind = 'quantity'  THEN n ELSE 0 END) AS quantities,
           sum(CASE WHEN kind = 'narrative' THEN n ELSE 0 END) AS narratives,
           sum(CASE WHEN kind = 'boolean'   THEN n ELSE 0 END) AS booleans
    ORDER BY quantities DESC, narratives DESC, company

# ── RANKING WITH CONTEXT — the join that makes a comparison mean something ────────────────────

- name: EsgPeerRanking
  description: >-
    Disclosure completeness with the firmographics attached: industry, headcount, country, listed
    or not. The bare leaderboard ranks a 171-person Danish fish processor against a 107,756-person
    French insurer and calls one better; this says what is being compared.
    `identitySuspect` is TRUE where the resolved company name does not contain the domain's own
    label — cisco.com resolves to "Sourcefire", a company Cisco acquired, with 560 employees and
    170 sources behind it. Treat that row's context as unverified: the DISCLOSURE figures are still
    the company's own, only the firmographics are in doubt.
  cypher: |
    MATCH (o:EsgObservation)
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.datapointId AS dp,
         max(CASE WHEN o.value <> 'not_disclosed' THEN 1 ELSE 0 END) AS disclosed
    WITH company, count(dp) AS assessed, sum(disclosed) AS disclosing
    OPTIONAL MATCH (s:EsgSubject {domain: company})
    RETURN company, s.name AS name,
           coalesce(s.industries[0], 'unknown') AS industry,
           s.nbEmployees AS staff, s.country AS country, s.isPublic AS listed,
           assessed, disclosing, round(100.0 * disclosing / assessed) AS pctDisclosed,
           s.nbOrigins AS sourceDepth,
           coalesce(s.domainNameMatch, true) = false AS identitySuspect
    ORDER BY pctDisclosed DESC, company

- name: EsgSectorComparison
  description: >-
    Disclosure rate by industry, with the number of companies behind each. THE COHORT IS THE POINT:
    a sector represented by one company is an anecdote wearing a percentage, so `companies` is a
    column and any sector with a small count should be read as a single data point rather than a
    finding. Rows whose identity is suspect are excluded, because a wrong industry puts a company
    in the wrong sector and quietly moves two averages at once.
  cypher: |
    MATCH (o:EsgObservation)
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.datapointId AS dp,
         max(CASE WHEN o.value <> 'not_disclosed' THEN 1 ELSE 0 END) AS disclosed
    WITH company, count(dp) AS assessed, sum(disclosed) AS disclosing
    MATCH (s:EsgSubject {domain: company})
    WHERE coalesce(s.domainNameMatch, true) = true
    WITH coalesce(s.industries[0], 'unknown') AS industry,
         count(company) AS companies, sum(disclosing) AS disclosed, sum(assessed) AS possible
    RETURN industry, companies, disclosed, possible,
           round(100.0 * disclosed / possible) AS pctDisclosed
    ORDER BY companies DESC, pctDisclosed DESC

- name: EsgSizeComparison
  description: >-
    Does size predict disclosure? Buckets companies by headcount and reports the rate in each, with
    the count behind it. The expected story — big companies disclose more — is worth TESTING rather
    than assuming, and on this corpus it does not hold: the fullest discloser is a 171-person fish
    processor that publishes a proper sustainability report, while several multinationals publish
    marketing pages. Size predicts REPORTING FORMAT more than transparency.
  cypher: |
    MATCH (o:EsgObservation)
    WITH replace(split(replace(replace(o.docUri, 'https://', ''), 'http://', ''), '/')[0], 'www.', '') AS company,
         o.datapointId AS dp,
         max(CASE WHEN o.value <> 'not_disclosed' THEN 1 ELSE 0 END) AS disclosed
    WITH company, count(dp) AS assessed, sum(disclosed) AS disclosing
    MATCH (s:EsgSubject {domain: company})
    WHERE coalesce(s.domainNameMatch, true) = true AND s.nbEmployees IS NOT NULL
    WITH CASE WHEN s.nbEmployees < 250 THEN 'under 250'
              WHEN s.nbEmployees < 5000 THEN '250-5k'
              ELSE 'over 5k' END AS sizeBand,
         company, disclosing, assessed
    RETURN sizeBand, count(company) AS companies,
           sum(disclosing) AS disclosed, sum(assessed) AS possible,
           round(100.0 * sum(disclosing) / sum(assessed)) AS pctDisclosed
    ORDER BY companies DESC
