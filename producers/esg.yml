# Graph-cached ESG observation extraction backing (d:Document)-[:HAS_OBSERVATIONS]->(o:EsgObservation).
#
# kind: extract — collect the document's chunks (incoming PART_OF, per-anchor by uri,
# owner-guarded), answer EVERY catalogued datapoint the text supports in one model call, and
# (cache kind graph) persist each record as a committed, scope-stamped node. Repeat traversals
# over an unchanged document serve the whole observation set with zero model calls; a change to
# the document REPLACES its stale rows.
#
# THE DATAPOINT BLOCK BELOW MIRRORS reference/datapoints.yml AND MUST STAY IDENTICAL TO IT.
# scripts/check-catalogue-sync.py fails if they drift — run it in CI. The duplication is
# deliberate (the prompt cannot read seeded reference data at extraction time) and therefore
# has to be enforced rather than trusted.
- name: esgExtraction
  kind: extract
  edgeType: HAS_OBSERVATIONS
  collect:
    targetLabel: Chunk
    via: PART_OF|HAS_PARENT*
    incoming: true
    anchorLabel: Document
    anchorKeyProperty: uri
    text: "{{ text }}"
    # Explicit rather than inherited: the collect cap decides how much of a document the model
    # actually sees, and an invisible default is the wrong place for that decision. A page of real
    # disclosure runs to a few dozen chunks (measured: 965 characters each), so this is generous for
    # a page and deliberately finite for a whole report.
    limit: 300
  extract:
    # Typed discipline needs a stronger model than the vc_execution default: a cheap tier answers
    # "what were your Scope 2 emissions in metric tons" with "Yes", which is the exact defect this
    # realm exists to beat. A portable ROLE, per-workspace remappable — never a model name.
    role: workhorse
    prompt: |
      You are reading numbered excerpts from material published by ONE organization.

      {% for item in items %}[{{ item.n }}] {{ item.text }}
      {% endfor %}

      Answer each of the following datapoints FROM THESE EXCERPTS ONLY.

        - id: ghg_scope1  (quantity, unit tCO2e, period required)
          Does the published material report the organization's Scope 1 (direct) greenhouse gas emissions? If so, give the figure exactly as published, its unit, and the reporting period it covers. If the material does not state a Scope 1 figure, answer not_disclosed — do not infer one from any other number.
        - id: ghg_scope2_location  (quantity, unit tCO2e, period required)
          Does the published material report location-based Scope 2 (purchased energy) greenhouse gas emissions? Give the figure, unit and period exactly as published. If the material reports Scope 2 without saying whether it is location- or market-based, record it here and note the ambiguity in the quote. If no Scope 2 figure is stated, answer not_disclosed.
        - id: ghg_scope2_market  (quantity, unit tCO2e, period required)
          Does the published material report market-based Scope 2 greenhouse gas emissions — i.e. reflecting contractual instruments such as renewable energy certificates or PPAs? Give the figure, unit and period as published, or not_disclosed.
        - id: ghg_scope3  (quantity, unit tCO2e, period required)
          Does the published material report Scope 3 (value chain) greenhouse gas emissions? Give the total figure, unit and period as published, and note which categories it says are included. A partial Scope 3 covering only some categories is still a reported figure — record it and say so in the quote. If none is stated, answer not_disclosed.
        - id: ghg_reduction_target  (narrative)
          Does the published material state a greenhouse gas reduction target? If so, quote it — including the percentage or absolute reduction, the baseline year, and the target year. A stated ambition without a figure or date is still a target: quote it as published rather than converting it into one. If no target is stated, answer not_disclosed.
        - id: climate_transition_plan  (narrative)
          Does the published material describe a plan for reducing the organization's climate impact — actions taken or committed to, with what they are expected to achieve? Quote what it actually says. This is the datapoint the baseline answers with the word "Yes" 79 times; a bare affirmation is NOT an answer here. If the material describes no such plan, answer not_disclosed.
        - id: energy_consumption_total  (quantity, unit MWh, period required)
          Does the published material report total energy consumption? Give the figure and its unit exactly as published — do NOT convert between units — plus the period. If none is stated, answer not_disclosed.
        - id: renewable_energy_share  (quantity, unit percent, period required)
          Does the published material state what proportion of the organization's energy comes from renewable sources? Give the percentage as published. A claim of "100% renewable electricity" is a figure — record 100 and quote the scope it applies to, since electricity is usually a subset of total energy. If no proportion is stated, answer not_disclosed.
        - id: water_withdrawal_total  (quantity, unit m3, period required)
          Does the published material report total water withdrawn or consumed? Give the figure, unit and period as published, and note whether it says withdrawal or consumption — they are different quantities and must not be conflated. If none is stated, answer not_disclosed.
        - id: safety_incident_rate  (quantity, unit rate, period required)
          Does the published material report a work-related injury or accident rate? Give the figure, the rate basis it is expressed on (per million hours worked, per 100 employees, …) and the period, exactly as published. A statement that safety is important is NOT a rate — that is not_disclosed for this datapoint.
        - id: board_gender_diversity  (quantity, unit percent)
          Does the published material state the gender composition of the board or governing body? Give the percentage as published, or the counts if only counts are given. Naming the board members is not a stated composition — do not count names to derive a figure. If no composition is stated, answer not_disclosed.
        - id: board_sustainability_oversight  (boolean, one of: yes, no, not_disclosed)
          Does the published material state that the board or a board committee has responsibility for sustainability or climate matters? Answer yes ONLY where the material says so — a sustainability page with no mention of who governs it is not_disclosed, and a general statement that the company cares about the environment is not board oversight.
        - id: business_conduct_policy  (boolean, one of: yes, no, not_disclosed)
          Does the published material include, or explicitly say it publishes, a code of conduct, business ethics policy or anti-corruption policy? Answer yes only where such a policy is named. A terms-and-conditions page, a privacy notice or a cookie policy is NOT a business conduct policy — the baseline cites exactly those pages as evidence, and they do not support this claim.

      Return a JSON array. For each datapoint you can answer, one object with exactly:
        - "datapointId": the id above, copied VERBATIM. Never invent an id.
        - "value": the answer, in the form the datapoint demands:
            * quantity  -> the NUMBER as published, digits only (e.g. "12400", "43.7").
                           NEVER "Yes". NEVER a converted or derived figure. If the text gives a
                           range, give the range as published.
            * narrative -> what the material actually SAYS, in one or two sentences drawn from
                           the excerpt. NEVER "Yes".
            * boolean   -> one of the listed values, nothing else.
          Use "not_disclosed" when the excerpts do not state it. That is a REAL ANSWER and is
          expected to be common — most organizations publish few of these.
        - "unit": the unit exactly as published, for a quantity. Do not convert.
        - "period": the reporting period the figure covers, as published, when the datapoint
          requires one. Omit if the text does not say.
        - "quote": the VERBATIM sentence supporting the answer — never a paraphrase, never
          assembled from separate places. Omit ONLY when value is "not_disclosed".
        - "confidence": "direct" when the quote states the answer outright; "inferred" when you
          read it from surrounding context. If you would need to assume anything, prefer
          "not_disclosed" over "inferred".
        - "sourceIndex": the excerpt number the quote came from.

      RULES, in order of importance:
      1. A quantitative datapoint is answered with a NUMBER or with "not_disclosed". Never "Yes".
      2. A narrative datapoint is answered with what was SAID or with "not_disclosed". Never "Yes".
      3. Silence is not assent. A page about sustainability that gives no figures answers
         "not_disclosed" for every quantity, and that is the correct output.
      4. Marketing language is not disclosure. "We care deeply about our planet" supports
         nothing. A cookie policy, a privacy notice and terms-and-conditions support nothing.
      5. Every non-"not_disclosed" answer MUST carry a verbatim quote from a numbered excerpt.
         No quote means no answer.
      6. Answer only for the ids listed. Skip anything else the text happens to contain.
